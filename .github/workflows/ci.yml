name: Release safety
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-safety-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install verified tools
        run: |
          bash scripts/install-ci-tools.sh
          echo "$PWD/.tools" >> "$GITHUB_PATH"
          python3 -m pip install -r requirements-dev.txt
      - name: Application and chart checks
        run: make test lint
      - name: Create isolated Kubernetes cluster
        run: make cluster
      - name: Build and load candidate image
        run: make build TAG="${GITHUB_SHA}"
      - name: Verify deployment failures and recovery
        run: |
          mkdir -p artifacts
          set -o pipefail
          bash scripts/drill.sh "$GITHUB_SHA" 2>&1 | tee artifacts/drill.log
      - name: Collect diagnostics
        if: always()
        run: bash scripts/diagnose.sh ci-final || true
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-safety-evidence
          path: artifacts/
          retention-days: 14
      - name: Remove disposable cluster
        if: always()
        run: kind delete cluster --name safe-release-demo
